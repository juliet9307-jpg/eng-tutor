<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA / iOS 홈 화면 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="영어코치" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>영어, 진짜처럼 말하기</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --indigo: #4f46e5;
      --violet: #7c3aed;
      --indigo-light: #e0e7ff;
      --bg: #f4f6ff;
      --white: #ffffff;
      --text: #1e293b;
      --muted: #94a3b8;
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; background: var(--bg); }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    #app {
      min-height: 100dvh;
      padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 40px);
      background: linear-gradient(160deg, #f4f6ff 0%, #eef1ff 50%, #f5f0ff 100%);
    }

    .wrap { max-width: 520px; margin: 0 auto; }

    /* Header */
    .header { text-align: center; margin-bottom: 24px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: white; border-radius: 100px; padding: 5px 14px;
      border: 1px solid var(--indigo-light);
      box-shadow: 0 2px 12px rgba(99,102,241,0.10);
      font-size: 11px; font-weight: 700; color: var(--indigo);
      letter-spacing: 1.5px; margin-bottom: 12px;
    }
    h1 {
      font-size: 26px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sub { font-size: 13px; color: var(--muted); margin-top: 5px; }

    /* Mode Toggle */
    .toggle-wrap {
      display: flex; background: white; border-radius: 14px; padding: 4px;
      margin-bottom: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.05); border: 1px solid #eef1ff;
    }
    .toggle-btn {
      flex: 1; padding: 11px 6px; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: all 0.2s; background: transparent; color: var(--muted);
      font-family: inherit;
    }
    .toggle-btn.active {
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      color: white;
      box-shadow: 0 4px 12px rgba(99,102,241,0.35);
    }

    /* Card */
    .card {
      background: white; border-radius: var(--radius); padding: 18px;
      box-shadow: 0 3px 20px rgba(0,0,0,0.06); border: 1px solid #eef1ff;
      margin-bottom: 12px;
    }

    /* Input */
    textarea {
      width: 100%; border: none; outline: none; resize: none;
      font-size: 15px; line-height: 1.7; color: var(--text);
      font-family: inherit; background: transparent; min-height: 110px;
    }
    textarea::placeholder { color: #c7cfe0; }
    .input-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 10px; border-top: 1px solid #f1f5f9; margin-top: 8px;
    }
    .char-count { font-size: 12px; color: #cbd5e1; }

    /* Button */
    .btn {
      border: none; border-radius: 12px; font-family: inherit;
      font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      color: white; padding: 10px 22px; font-size: 14px;
      box-shadow: 0 4px 12px rgba(99,102,241,0.35);
    }
    .btn-primary:disabled {
      background: #e2e8f0; color: var(--muted);
      box-shadow: none; cursor: not-allowed;
    }
    .btn-full {
      width: 100%; padding: 13px; font-size: 15px; border-radius: 14px;
    }
    .btn-ghost {
      background: none; color: var(--indigo); font-size: 12px;
      padding: 6px 0; font-weight: 600; cursor: pointer; border: none;
      font-family: inherit;
    }

    /* Intent box */
    .intent-section { border-top: 1px dashed #e8ecf5; padding-top: 10px; margin-top: 4px; }
    .intent-textarea {
      min-height: 56px; font-size: 13px; color: #475569;
      background: #f8faff; border: 1px solid var(--indigo-light);
      border-radius: 10px; padding: 10px 12px; margin-top: 6px;
    }

    /* Error */
    .error-box {
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 12px; padding: 13px 16px; margin-bottom: 12px;
    }
    .error-box p { font-size: 13px; color: #dc2626; word-break: break-all; }
    .error-box small { font-size: 11px; color: #b91c1c; display: block; margin-top: 6px; }
    .error-box a { color: var(--violet); font-weight: 700; text-decoration: none; }

    /* Loading */
    .loading { text-align: center; padding: 48px 0; color: var(--muted); }
    .spin { display: inline-block; font-size: 28px; animation: spin 1.8s linear infinite; margin-bottom: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result cards */
    .result-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px;
    }
    .main-translation {
      font-size: 20px; font-weight: 700; color: var(--text); line-height: 1.5;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .alt-card {
      padding: 11px 13px; border-radius: 12px; margin-bottom: 8px;
    }
    .alt-card p { font-size: 14px; font-weight: 600; font-family: Georgia, serif; margin-bottom: 3px; }
    .alt-card small { font-size: 11px; color: var(--muted); }

    .tip-card {
      background: linear-gradient(135deg, #fffbeb, #fef9c3);
      border: 1px solid #fde68a; border-radius: 14px;
      padding: 14px 16px; display: flex; gap: 10px; margin-bottom: 12px;
    }
    .tip-card .tip-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .tip-label { font-size: 10px; font-weight: 700; color: #92400e; letter-spacing: 1px; margin-bottom: 4px; }
    .tip-text { font-size: 13px; color: #78350f; line-height: 1.6; }

    /* Score ring */
    .score-row { display: flex; gap: 14px; align-items: flex-start; }
    .score-ring { position: relative; width: 68px; height: 68px; flex-shrink: 0; }
    .score-ring svg { transform: rotate(-90deg); }
    .score-inner {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .score-num { font-size: 17px; font-weight: 800; line-height: 1; }
    .score-lbl { font-size: 8px; color: var(--muted); letter-spacing: 1px; }

    .tag {
      display: inline-block; padding: 2px 9px; border-radius: 20px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
    }

    .nuance-card {
      background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
      border: 1px solid #bae6fd; border-radius: 14px; padding: 14px 16px;
      margin-bottom: 12px;
    }
    .nuance-label { font-size: 10px; font-weight: 700; color: #0369a1; letter-spacing: 1px; margin-bottom: 6px; }
    .nuance-text { font-size: 13px; color: #0c4a6e; line-height: 1.7; }

    .grammar-card {
      background: #fff8f0; border: 1px solid #fed7aa;
      border-radius: 10px; padding: 10px 13px; margin-bottom: 8px;
    }
    .grammar-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 5px; }
    .wrong { background: #fee2e2; color: #dc2626; padding: 1px 8px; border-radius: 10px; font-size: 12px; text-decoration: line-through; font-family: Georgia,serif; }
    .right  { background: #dcfce7; color: #16a34a; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; font-family: Georgia,serif; }
    .grammar-exp { font-size: 12px; color: #78716c; }

    .ok-card {
      background: #f0fdf4; border: 1px solid #bbf7d0;
      border-radius: 14px; padding: 13px 16px; display: flex; gap: 8px;
      align-items: center; margin-bottom: 12px;
    }

    .enc-card {
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      border-radius: 14px; padding: 15px 18px; display: flex; gap: 10px;
      align-items: center; margin-bottom: 12px;
    }
    .enc-card p { font-size: 13px; color: white; line-height: 1.6; }

    /* API Key setup */
    .setup-wrap {
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: calc(var(--safe-top) + 24px) 20px calc(var(--safe-bottom) + 24px);
      background: linear-gradient(160deg, #f4f6ff, #eef1ff, #f5f0ff);
    }
    .setup-inner { max-width: 400px; width: 100%; }
    .setup-icon { font-size: 48px; text-align: center; margin-bottom: 14px; }
    .setup-title {
      text-align: center; font-size: 22px; font-weight: 800; margin-bottom: 6px;
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .setup-desc { text-align: center; font-size: 13px; color: #64748b; line-height: 1.7; margin-bottom: 24px; }

    .key-input-wrap { position: relative; }
    .key-input {
      width: 100%; padding: 13px 44px 13px 14px;
      border: 1.5px solid var(--indigo-light); border-radius: 12px;
      font-size: 14px; outline: none; color: var(--text);
      background: #fafbff; font-family: monospace;
    }
    .key-input:focus { border-color: var(--indigo); }
    .eye-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 16px; padding: 0;
    }

    .guide-card {
      background: #fffbeb; border: 1px solid #fde68a;
      border-radius: 14px; padding: 14px 16px; margin-top: 14px;
    }
    .guide-card p { font-size: 12px; color: #92400e; line-height: 1.9; }

    .footer-link { text-align: center; margin-top: 20px; }
    .footer-link button { background: none; border: none; font-size: 12px; color: #c7cfe0; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.23.1';
import { useState, useEffect, useCallback } from 'https://esm.sh/preact@10.23.1/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);

/* ─── 상수 ─── */
const MODES = { KO: 'ko', EN: 'en' };
const KEY_STORE = 'eng_tutor_key_v1';

const SYS = {
  [MODES.KO]: `You are a native English translation expert. Translate Korean into the most natural, everyday English a native speaker would use.
Respond ONLY in this exact JSON (no markdown):
{"main_translation":"...","tone_note":"...","alternatives":[{"text":"...","note":"..."},{"text":"...","note":"..."}],"cultural_tip":"...or null"}`,
  [MODES.EN]: `You are an expert English coach for Korean learners. Analyze for grammar, naturalness, nuance.
Respond ONLY in this exact JSON (no markdown):
{"overall_score":85,"nuance_delivered":true,"corrected":"...","grammar_issues":[{"original":"...","fix":"...","explanation":"...Korean..."}],"nuance_analysis":"...Korean...","native_alternatives":[{"text":"...","note":"...Korean..."}],"encouragement":"...Korean..."}
Empty array if no grammar issues.`
};

/* ─── API 호출 ─── */
async function callClaude(apiKey, mode, content) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'anthropic-version': '2023-06-01',
      'x-api-key': apiKey,
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1000,
      system: SYS[mode],
      messages: [{ role: 'user', content }],
    }),
  });

  const raw = await res.text();
  let data;
  try { data = JSON.parse(raw); }
  catch { throw new Error('응답 파싱 실패: ' + raw.slice(0, 100)); }

  if (!res.ok) throw new Error(data?.error?.message || 'HTTP ' + res.status);

  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  if (!text) throw new Error('빈 응답');

  const s = text.indexOf('{'), e = text.lastIndexOf('}');
  if (s === -1 || e === -1) throw new Error('JSON 없음: ' + text.slice(0, 80));
  return JSON.parse(text.slice(s, e + 1));
}

/* ─── 작은 컴포넌트 ─── */
function ScoreRing({ score }) {
  const r = 28, c = 2 * Math.PI * r;
  const offset = c - (score / 100) * c;
  const color = score >= 80 ? '#4ade80' : score >= 60 ? '#fbbf24' : '#f87171';
  return html`
    <div class="score-ring">
      <svg width="68" height="68">
        <circle cx="34" cy="34" r=${r} fill="none" stroke="#e2e8f0" stroke-width="5"/>
        <circle cx="34" cy="34" r=${r} fill="none" stroke=${color} stroke-width="5"
          stroke-dasharray=${c} stroke-dashoffset=${offset} stroke-linecap="round"
          style="transition:stroke-dashoffset 1s ease"/>
      </svg>
      <div class="score-inner">
        <span class="score-num" style="color:${color}">${score}</span>
        <span class="score-lbl">SCORE</span>
      </div>
    </div>`;
}

function GrammarCard({ issue }) {
  return html`
    <div class="grammar-card">
      <div class="grammar-row">
        <span class="wrong">${issue.original}</span>
        <span style="color:#94a3b8">→</span>
        <span class="right">${issue.fix}</span>
      </div>
      <p class="grammar-exp">${issue.explanation}</p>
    </div>`;
}

/* ─── API Key 설정 화면 ─── */
function ApiKeySetup({ onSave }) {
  const [key, setKey] = useState('');
  const [show, setShow] = useState(false);
  const [testing, setTesting] = useState(false);
  const [err, setErr] = useState(null);

  const save = useCallback(async () => {
    const k = key.trim();
    if (!k.startsWith('sk-ant-')) { setErr("'sk-ant-'로 시작하는 키를 입력해주세요."); return; }
    setTesting(true); setErr(null);
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'anthropic-version': '2023-06-01', 'x-api-key': k },
        body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 5, messages: [{ role: 'user', content: 'hi' }] }),
      });
      const d = await res.json();
      if (!res.ok) throw new Error(d?.error?.message || 'HTTP ' + res.status);
      localStorage.setItem(KEY_STORE, k);
      onSave(k);
    } catch(e) {
      setErr('확인 실패: ' + e.message);
    } finally { setTesting(false); }
  }, [key, onSave]);

  return html`
    <div class="setup-wrap">
      <div class="setup-inner">
        <div class="setup-icon">🔑</div>
        <h2 class="setup-title">API Key 설정</h2>
        <p class="setup-desc">이 앱은 Anthropic API를 직접 사용해요.<br/>본인의 API key를 입력하면 바로 사용 가능해요.</p>

        <div class="card">
          <div style="font-size:11px;font-weight:700;color:#6366f1;letter-spacing:1px;margin-bottom:8px">ANTHROPIC API KEY</div>
          <div class="key-input-wrap">
            <input class="key-input" type=${show ? 'text' : 'password'}
              value=${key} placeholder="sk-ant-api03-..."
              onInput=${e => { setKey(e.target.value); setErr(null); }} />
            <button class="eye-btn" onClick=${() => setShow(!show)}>${show ? '🙈' : '👁️'}</button>
          </div>
          ${err && html`<p style="font-size:12px;color:#dc2626;margin-top:6px">${err}</p>`}
          <button class="btn btn-primary btn-full" style="margin-top:14px"
            disabled=${!key.trim() || testing} onClick=${save}>
            ${testing ? '확인 중...' : '저장하고 시작하기 →'}
          </button>
        </div>

        <div class="guide-card">
          <p>💡 <strong>API key 발급 방법</strong><br/>
          1. <strong>console.anthropic.com</strong> 접속<br/>
          2. API Keys → Create Key<br/>
          3. 복사한 키를 위에 붙여넣기<br/>
          <span style="color:#b45309">※ 키는 이 기기에만 저장돼요.</span></p>
        </div>
      </div>
    </div>`;
}

/* ─── 메인 앱 ─── */
function App() {
  const [apiKey, setApiKey] = useState(null);
  const [ready, setReady] = useState(false);
  const [mode, setMode] = useState(MODES.KO);
  const [input, setInput] = useState('');
  const [intent, setIntent] = useState('');
  const [showIntent, setShowIntent] = useState(false);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    const k = localStorage.getItem(KEY_STORE);
    if (k) setApiKey(k);
    setReady(true);
  }, []);

  const analyze = useCallback(async () => {
    if (!input.trim() || !apiKey) return;
    setLoading(true); setResult(null); setError(null);
    const content = mode === MODES.EN && intent.trim()
      ? `English text: "${input}"\n\nMy intended meaning (Korean): ${intent}`
      : input;
    try { setResult(await callClaude(apiKey, mode, content)); }
    catch(e) { setError(e.message); }
    finally { setLoading(false); }
  }, [input, mode, intent, apiKey]);

  const switchMode = m => {
    setMode(m); setInput(''); setIntent(''); setShowIntent(false); setResult(null); setError(null);
  };

  const resetKey = () => { localStorage.removeItem(KEY_STORE); setApiKey(null); setResult(null); setError(null); };

  if (!ready) return html`<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center"><div class="spin">✦</div></div>`;
  if (!apiKey) return html`<${ApiKeySetup} onSave=${setApiKey} />`;

  const ph = mode === MODES.KO
    ? '번역할 한국어 문장을 입력하세요\n예) 오늘 날씨 진짜 좋다, 같이 뭐 먹을래?'
    : '교정받을 영어 문장을 입력하세요\nEx) I am very happy to meeting you.';

  return html`
    <div id="app">
      <div class="wrap">

        <!-- Header -->
        <div class="header">
          <div class="badge">✦ AI ENGLISH COACH</div>
          <h1>영어, 진짜처럼 말하기</h1>
          <p class="sub">원어민처럼 번역하고 · 내 영어를 정확하게 교정받기</p>
        </div>

        <!-- Mode Toggle -->
        <div class="toggle-wrap">
          <button class=${'toggle-btn' + (mode===MODES.KO?' active':'')} onClick=${()=>switchMode(MODES.KO)}>
            🇰🇷→🇺🇸 자연스러운 영어로
          </button>
          <button class=${'toggle-btn' + (mode===MODES.EN?' active':'')} onClick=${()=>switchMode(MODES.EN)}>
            ✍️ 내 영어 교정받기
          </button>
        </div>

        <!-- Input -->
        <div class="card">
          <textarea placeholder=${ph} value=${input}
            onInput=${e => setInput(e.target.value)} rows="5"></textarea>

          ${mode === MODES.EN && html`
            <div class="intent-section">
              <button class="btn-ghost" onClick=${()=>setShowIntent(!showIntent)}>
                💬 ${showIntent ? '의도 입력 닫기' : '전달하려는 뉘앙스 입력하기 (선택)'}
              </button>
              ${showIntent && html`
                <textarea class="intent-textarea" placeholder="예) 어제 만나서 반가웠다고 친근하게 말하고 싶었어요."
                  value=${intent} onInput=${e=>setIntent(e.target.value)} rows="3"></textarea>`}
            </div>`}

          <div class="input-footer">
            <span class="char-count">${input.length > 0 ? input.length+'자' : '입력 후 버튼 탭'}</span>
            <button class="btn btn-primary" disabled=${!input.trim()||loading} onClick=${analyze}>
              ${loading ? '분석 중...' : mode===MODES.KO ? '번역하기 →' : '교정받기 →'}
            </button>
          </div>
        </div>

        <!-- Error -->
        ${error && html`
          <div class="error-box">
            <p>${error}</p>
            ${(error.includes('401')||error.includes('auth')||error.includes('key')) && html`
              <small>API key 문제예요. <a href="#" onClick=${e=>{e.preventDefault();resetKey();}}>키 재설정하기</a></small>`}
          </div>`}

        <!-- Loading -->
        ${loading && html`
          <div class="loading">
            <div class="spin">✦</div>
            <p style="font-size:14px">AI가 분석하고 있어요...</p>
          </div>`}

        <!-- Result: KO→EN -->
        ${result && mode===MODES.KO && html`
          <div>
            <div class="card">
              <div class="result-label" style="color:#6366f1">🗣️ 가장 자연스러운 표현
                ${result.tone_note && html` <span class="tag" style="background:#e0e7ff;color:#4338ca">${result.tone_note}</span>`}
              </div>
              <p class="main-translation">"${result.main_translation}"</p>
            </div>

            ${result.alternatives?.length > 0 && html`
              <div class="card">
                <div class="result-label" style="color:#7c3aed">💬 다른 표현들</div>
                ${result.alternatives.map((a,i)=>html`
                  <div class="alt-card" style="background:${i%2===0?'#f8faff':'#faf5ff'};border:1px solid ${i%2===0?'#e0e7ff':'#ede9fe'}">
                    <p>"${a.text}"</p>
                    <small>${a.note}</small>
                  </div>`)}
              </div>`}

            ${result.cultural_tip && result.cultural_tip!=='null' && html`
              <div class="tip-card">
                <span class="tip-icon">💡</span>
                <div>
                  <div class="tip-label">CULTURAL TIP</div>
                  <p class="tip-text">${result.cultural_tip}</p>
                </div>
              </div>`}
          </div>`}

        <!-- Result: EN Check -->
        ${result && mode===MODES.EN && html`
          <div>
            <div class="card">
              <div class="score-row">
                <${ScoreRing} score=${result.overall_score} />
                <div style="flex:1">
                  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
                    <span class="result-label" style="color:#6366f1;margin:0">교정된 문장</span>
                    <span class="tag" style="background:${result.nuance_delivered?'#dcfce7':'#fee2e2'};color:${result.nuance_delivered?'#16a34a':'#dc2626'}">
                      ${result.nuance_delivered ? '✓ 뉘앙스 전달됨' : '⚠ 뉘앙스 수정 필요'}
                    </span>
                  </div>
                  <p style="font-size:16px;font-weight:600;font-family:Georgia,serif;line-height:1.6">"${result.corrected}"</p>
                </div>
              </div>
            </div>

            <div class="nuance-card">
              <div class="nuance-label">🎯 뉘앙스 분석</div>
              <p class="nuance-text">${result.nuance_analysis}</p>
            </div>

            ${result.grammar_issues?.length > 0 ? html`
              <div class="card">
                <div class="result-label" style="color:#ef4444">⚠ 문법 교정 포인트</div>
                ${result.grammar_issues.map(g=>html`<${GrammarCard} issue=${g}/>`)}
              </div>` : html`
              <div class="ok-card">
                <span>🎉</span>
                <p style="font-size:13px;color:#166534;font-weight:600">문법 오류가 없어요! 완벽합니다.</p>
              </div>`}

            ${result.native_alternatives?.length > 0 && html`
              <div class="card">
                <div class="result-label" style="color:#7c3aed">🗣️ 원어민 표현</div>
                ${result.native_alternatives.map(a=>html`
                  <div class="alt-card" style="background:#faf5ff;border:1px solid #ede9fe">
                    <p>"${a.text}"</p>
                    <small>${a.note}</small>
                  </div>`)}
              </div>`}

            ${result.encouragement && html`
              <div class="enc-card">
                <span>✨</span>
                <p>${result.encouragement}</p>
              </div>`}
          </div>`}

        <!-- Footer -->
        <div class="footer-link">
          <button onClick=${resetKey}>🔑 API Key 변경</button>
        </div>
      </div>
    </div>`;
}

render(html`<${App}/>`, document.getElementById('app'));

/* ─── Service Worker (오프라인 캐싱) ─── */
if ('serviceWorker' in navigator) {
  const sw = `
    const CACHE = 'eng-tutor-v1';
    const URLS = ['/'];
    self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(URLS))));
    self.addEventListener('fetch', e => {
      if (e.request.url.includes('api.anthropic.com')) return;
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const blob = new Blob([sw], { type: 'application/javascript' });
  const url  = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(() => {});
}
</script>
</body>
</html>
